research:
  - org: "Advanced Control System Lab (Korea Univ.)"
    role: "M.S. Research"
    period: "2022.03 ~ 2024.02"
    topic: "Development of OAFMCL (Odometry Aided Finite-Memory Cooperative Localization) algorithm"
    bullets:
      - "Designed a Finite-Memory (FIR)-based cooperative localization (FMCL) algorithm that resolves the error-accumulation problem of recursive (IIR) estimation"
      - "Structured the team so the Leader obtains an absolute position from fixed anchors via an RTLS tag while Followers measure relative distance and direction with low-cost LiDAR"
      - "Fused the external-sensor-based FMCL with the internal-sensor-based Odometry-NN through a neural network (FMCL + Odometry-NN → Fusion NN → final position estimate), with joint-motion data as input for robustness to walking vibration"
      - "Ran demonstration experiments on multiple humanoid robots, separated into a normal condition and a Robot Kidnapping condition"
      - "Achieved an average error of 0.07 m under Robot Kidnapping, up to about 80% lower (vs. LHOL) than existing algorithms"
      - "Experimental results (RTAMSE, meter): Normal condition — OAFMCL 0.0474 vs MFDKF 0.1527 / NLSPGO 0.1012 / LHOL 0.0857; Robot Kidnapping — OAFMCL 0.0687 vs MFDKF 0.1103 / NLSPGO 0.0881 / LHOL 0.3791"
    keywords: ["OAFMCL", "FiniteMemoryFilter", "CooperativeLocalization", "NeuralNetwork", "HumanoidRobot", "RTLS", "LiDAR"]
  - org: "National Research Foundation of Korea (NRF) Project"
    role: "Project Research"
    period: "2022.03 ~ 2024.02"
    topic: "AI-based Cooperative Autonomous Swarm Anti-Drone System for Neutralizing Illegal Drones (Multi-UAV Formation Control)"
    bullets:
      - "Developed distributed control that keeps follower UAVs in formation from relative vectors and distance information referenced to a Virtual Leader"
      - "Countered error accumulation and nonlinearity with a Finite-Memory distributed controller that uses only data inside a fixed window"
      - "Guaranteed dynamic formation stability with a graph-based interaction topology model reflecting relative distance and angle between followers"
      - "Developed a collision-avoidance algorithm and realized decentralized cooperative control without central communication, as followers track a shared virtual target point"
      - "Validated via MATLAB simulation and Pixhawk hardware experiments (1 Virtual Leader + 4 Followers), with formation error within ±0.2 m and fast convergence"
    keywords: ["Pixhawk", "DistributedControl", "FormationControl", "MultiUAV", "VirtualLeader", "GraphModel", "ROS"]
  - org: "Korea Institute of Science and Technology (KIST), Robot Vision Lab"
    role: "Intern"
    period: "2021.01 ~ 2021.02"
    topic: "Research on applying ROS-based image processing algorithms to mobile robots"
    bullets:
      - "Researched image processing algorithms in a ROS environment"
      - "Tested the algorithms applied to mobile robot navigation"
    keywords: ["ROS", "RobotVision", "ImageProcessing", "MobileRobot"]
  - org: "ROBIT (Robotics Competition Team, Kwangwoon Univ.)"
    role: "Member · Humanoid Team Leader (2020)"
    period: "2019.01 ~ 2022.02"
    topic: "Development of vision, localization, and control systems for competition humanoid robots"
    bullets:
      - "Led development of the full robot system (circuits, firmware, vision, control) for the RoboCup Humanoid League"
      - "Improved indoor/outdoor recognition stability with OpenCV color-based vision processing robust to lighting changes"
      - "Implemented visual localization: extracted soccer-field lines → converted them to a likelihood model → applied Particle Filter weighting"
      - "Designed and built humanoid control circuits and developed STM-based firmware for motor and sensor control"
      - "Participated in domestic and international competitions, including a team trip to RoboCup 2019 Sydney, earning multiple awards"
      - "Engaged in outreach activities such as operating robot demonstration booths at science festivals and exhibitions"
    keywords: ["HumanoidRobot", "ComputerVision", "VisualLocalization", "ParticleFilter", "STM32", "EmbeddedSystem"]
  - org: "Capstone Design — Contactless Caddy Service Robot"
    role: "Team Leader"
    period: "2021.01 ~ 2021.12"
    topic: "Development of a ROS-based outdoor autonomous caddy robot prototype (2D LiDAR obstacle avoidance + GPS user-following)"
    bullets:
      - "Generated target points from the user's remote-control GPS position, then avoided dynamic and static obstacles while following the user"
      - "Designed a Potential Field structure combining an attractive force toward the user and a repulsive force from obstacles"
      - "Built a GPS/IMU/2D LiDAR perception pipeline with IMU-based heading estimation and north-referenced coordinate normalization"
      - "Validated the algorithms in ODE simulation first, then applied them stepwise to real-vehicle driving"
      - "Designed and integrated the power and control circuits directly to complete a robot platform capable of outdoor driving"
    keywords: ["AutonomousRobot", "PotentialField", "UserFollowing", "ObstacleAvoidance", "MobileRobot"]

