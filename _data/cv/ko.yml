research:
  - org: "Advanced Control System Lab (Korea Univ.)"
    role: "석사 연구"
    period: "2022.03 ~ 2024.02"
    topic: "OAFMCL (Odometry Aided Finite-Memory Cooperative Localization) 알고리즘 개발"
    bullets:
      - "재귀 추정(IIR)의 오차 누적 문제를 해결하는 유한 메모리(FIR) 기반 협력 위치 추정(FMCL) 알고리즘 설계"
      - "Leader는 RTLS 태그로 고정 앵커 기준 절대 위치를, Follower는 저가형 LiDAR로 상대 거리·방향을 얻는 구성"
      - "외부 센서 기반 FMCL과 내부 센서 기반 Odometry-NN의 신경망 융합(FMCL + Odometry-NN → Fusion NN → 최종 위치 추정), 관절 움직임 데이터를 입력으로 삼아 보행 진동에 대한 강인성 개선"
      - "다중 휴머노이드 로봇 환경에서 정상 상황과 Robot Kidnapping 상황을 나눈 실증 실험"
      - "Robot Kidnapping 상황 평균 오차 0.07m, 기존 알고리즘 대비 최대 약 80%(LHOL 대비) 오차 감소"
      - "실험 수치 (RTAMSE, meter): Normal condition — OAFMCL 0.0474 vs MFDKF 0.1527 / NLSPGO 0.1012 / LHOL 0.0857; Robot Kidnapping — OAFMCL 0.0687 vs MFDKF 0.1103 / NLSPGO 0.0881 / LHOL 0.3791"
    keywords: ["OAFMCL", "FiniteMemoryFilter", "CooperativeLocalization", "NeuralNetwork", "HumanoidRobot", "RTLS", "LiDAR"]
  - org: "한국연구재단(NRF) 프로젝트"
    role: "과제 연구"
    period: "2022.03 ~ 2024.02"
    topic: "불법드론 무력화를 위한 AI 기반 협력적 자율주행 스웜 안티드론 시스템 (Multi-UAV Formation Control)"
    bullets:
      - "가상 리더(Virtual Leader)를 기준으로 팔로워 UAV들이 상대 벡터와 거리 정보로 포메이션을 유지하는 분산 제어 기술 개발"
      - "일정 구간(window) 내 데이터만 사용하는 Finite-Memory 분산 제어기로 오차 누적과 비선형성에 대응"
      - "팔로워 간 연결 관계(상대 거리·각도)를 반영한 그래프 기반 상호위상 모델로 동적 포메이션 안정성 보장"
      - "충돌 회피 알고리즘 개발, 공통의 가상 목표점 추종을 통해 중앙 통신 없는 분산 협력 제어 실현"
      - "MATLAB 시뮬레이션과 Pixhawk 하드웨어(Virtual Leader 1대 + 팔로워 4대) 실험으로 검증, 포메이션 오차 ±0.2m 이내와 빠른 수렴 특성 확인"
    keywords: ["Pixhawk", "DistributedControl", "FormationControl", "MultiUAV", "VirtualLeader", "GraphModel", "ROS"]
  - org: "한국과학기술연구원(KIST) Robot Vision Lab"
    role: "인턴"
    period: "2021.01 ~ 2021.02"
    topic: "ROS 기반 영상처리 알고리즘의 모바일 로봇 적용 연구"
    bullets:
      - "ROS 환경에서의 영상처리 알고리즘 연구"
      - "모바일 로봇 주행에 알고리즘을 적용한 테스트 수행"
    keywords: ["ROS", "RobotVision", "ImageProcessing", "MobileRobot"]
  - org: "광운대학교 로봇게임단 ROBIT"
